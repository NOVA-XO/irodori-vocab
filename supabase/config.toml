# Supabase-ийн Edge Function-ий тохиргоо.
#
# `verify_jwt = false` — ЯАГААД: төслийн публик түлхүүр нь шинэ хэлбэрийн
# `sb_publishable_…` бөгөөд JWT БИШ. JWT шалгалт асаалттай үед хөтчөөс
# ирсэн хүсэлтийг бүгдийг нь татгалзана.
#
# Энэ нь нэмэлт эрсдэл ҮҮСГЭХГҮЙ: публик түлхүүр хэдийнэ хөтөч дээр
# байдаг тул «нэвтрэлт» гэж байгаагүй. Бодит хамгаалалт нь функц дотор:
#   · IP тутамд цагт 60 хүсэлт,
#   · оролтын мөрийг 200 тэмдэгтээр таслах,
#   · LLM-ийн түлхүүр зөвхөн серверийн нууцад байх.
[functions.judge]
verify_jwt = false
