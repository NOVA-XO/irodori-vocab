# Санал хүсэлтийг GitHub Issue болгоно.
#
# Яагаад аппаас шууд Issue үүсгэдэггүй вэ: GitHub API токен шаарддаг ба
# статик сайтад тавьсан токеныг хэн ч хулгайлж репод дураараа бичих болно.
# Тиймээс токен нь ЗӨВХӨН энд — GitHub-ийн шифрлэгдсэн Secrets дотор байна.
#
# Тохируулах (нэг удаа):
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL          https://<төслийн-id>.supabase.co
#     SUPABASE_SERVICE_KEY  Supabase → Project Settings → API keys → service_role
#   service_role түлхүүрийг ХЭЗЭЭ Ч репод бичихгүй, хэнд ч илгээхгүй.
name: feedback-to-issues

on:
  schedule:
    - cron: '*/30 * * * *'      # 30 минут тутам
  workflow_dispatch:            # гараар ажиллуулах товч

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Шинэ санал хүсэлтийг Issue болгох
        env:
          SB_URL_RAW: ${{ secrets.SUPABASE_URL }}
          SB_KEY_RAW: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Нууцыг хуулж тавихад зай, таб, шинэ мөр санамсаргүй ороод ирдэг.
          # Тэр нь curl-д «Malformed input to a URL function» гэсэн алдаа өгнө,
          # логт зөвхөн *** харагддаг тул шалтгаан нь олдоход хэцүү. Цэвэрлэнэ.
          SB_URL="$(printf '%s' "${SB_URL_RAW:-}" | tr -d '[:space:]' | sed 's:/*$::')"
          SB_KEY="$(printf '%s' "${SB_KEY_RAW:-}" | tr -d '[:space:]')"

          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_KEY тохируулаагүй байна."
            exit 0
          fi

          # Түлхүүрийн ТӨРЛИЙГ шалгана. Зөвхөн нэрийг нь хэвлэнэ — түлхүүр
          # өөрөө хэзээ ч логт гарахгүй. Публик түлхүүр нь RLS-ийг тойрдоггүй
          # тул хүснэгтээс ҮРГЭЛЖ хоосон жагсаалт ирдэг: алдаа мэт харагдахгүй,
          # зүгээр л «шинэ санал алга» гэж дуусдаг. Тиймээс эндээс зогсооно.
          case "$SB_KEY" in
            eyJ*)             echo "түлхүүр: legacy JWT (service_role байх ёстой)" ;;
            sb_secret_*)      echo "түлхүүр: sb_secret" ;;
            sb_publishable_*)
              echo "АЛДАА: SUPABASE_SERVICE_KEY-д ПУБЛИК түлхүүр хадгалагдсан байна."
              echo "Supabase → Project Settings → API Keys → service_role (эсвэл sb_secret_…)"
              exit 1 ;;
            *)                echo "түлхүүр: тодорхойгүй хэлбэр" ;;
          esac

          # issue_no хоосон буюу хараахан Issue болоогүй мөрүүд
          curl -sS -X GET \
            "$SB_URL/rest/v1/feedback?issue_no=is.null&order=created_at.asc&limit=50" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -o pending.json

          if ! jq -e 'type == "array"' pending.json > /dev/null 2>&1; then
            echo "Supabase-аас жагсаалт ирсэнгүй:"
            head -c 400 pending.json
            exit 1
          fi

          COUNT=$(jq 'length' pending.json)
          echo "хүлээгдэж буй: $COUNT"
          # `[ ... ] && exit 0` гэж бичвэл тэнцүү БИШ үед бүхэл мөр 1 буцааж,
          # `set -e` ажлыг тасалдаг. Тиймээс бүтэн if ашиглана.
          if [ "$COUNT" -eq 0 ]; then
            echo "шинэ санал хүсэлт алга."
            exit 0
          fi

          for i in $(seq 0 $((COUNT - 1))); do
            ID=$(jq -r ".[$i].id" pending.json)
            KIND=$(jq -r ".[$i].kind" pending.json)
            BODY=$(jq -r ".[$i].body" pending.json)
            CONTACT=$(jq -r '.['"$i"'].contact // ""' pending.json)
            CREATED=$(jq -r ".[$i].created_at" pending.json)
            META=$(jq -c ".[$i].meta" pending.json)

            case "$KIND" in
              bug)  LABEL="bug";         PREFIX="Алдаа" ;;
              idea) LABEL="enhancement"; PREFIX="Санал" ;;
              *)    LABEL="question";    PREFIX="Санал хүсэлт" ;;
            esac

            # Гарчиг = эхний мөр, 70 ТЭМДЭГТЭЭР таслав.
            # `cut -c` нь runner дээр (LANG=C) БАЙТААР тасалдаг тул кирилл,
            # кана зэрэг олон байтын тэмдэгтийг дундуур нь хагалж «болн?»
            # гэсэн эвдэрсэн үсэг үлдээдэг. jq-гийн мөрийн зүсэлт нь
            # юникод тэмдэгтээр ажилладаг — түүгээр л таслана.
            TITLE=$(jq -r ".[$i].body" pending.json | head -n 1 | jq -Rr '.[0:70]')
            if [ -z "$TITLE" ]; then TITLE="(гарчиггүй)"; fi

            {
              printf '%s\n\n' "$BODY"
              printf -- '---\n'
              printf '_Аппын доторх санал хүсэлтийн хэсгээс автоматаар._\n'
              printf '* илгээсэн: `%s`\n' "$CREATED"
              if [ -n "$CONTACT" ]; then
                printf '* холбоо барих: `%s`\n' "$CONTACT"
              fi
              printf '* орчин: `%s`\n' "$META"
              printf '* feedback id: `%s`\n' "$ID"
            } > issue.md

            # Шошго репод байхгүй бол gh алдаа өгдөг — тэр үед шошгогүйгээр
            # дахин оролдоно. `|| true` нь set -e-г тасалдуулахгүй.
            URL=$(gh issue create --repo "$REPO" --title "$PREFIX: $TITLE" \
                    --body-file issue.md --label "$LABEL" 2>/dev/null || true)
            if [ -z "$URL" ]; then
              URL=$(gh issue create --repo "$REPO" --title "$PREFIX: $TITLE" \
                      --body-file issue.md)
            fi

            NUM=$(printf '%s' "$URL" | grep -o '[0-9][0-9]*$' || true)
            if [ -z "$NUM" ]; then
              echo "Issue үүссэн эсэхийг тогтоож чадсангүй: $URL"
              continue
            fi
            echo "feedback $ID -> issue #$NUM"

            # Дахин Issue үүсгэхгүйн тулд тэмдэглэнэ
            curl -sS -X PATCH "$SB_URL/rest/v1/feedback?id=eq.$ID" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"issue_no\": $NUM}" > /dev/null
          done
