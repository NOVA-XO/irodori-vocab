<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3350">
<title>いろどり 入門 — Шинэ үг</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar">
  <button id="btn-home" class="ghost" title="Нүүр">‹</button>
  <div class="title"><span class="jp">いろどり</span> <small>入門</small></div>
  <button id="btn-stats" class="ghost" title="Явц">▦</button>
</header>

<!-- ═══════════════════ НҮҮР ═══════════════════ -->
<section id="home" class="screen">

  <div id="due-card" class="due">
    <div class="due-n" id="due-n">—</div>
    <div class="due-t">өнөөдөр давтах үг</div>
    <button id="btn-review" class="primary big">Давталт эхлүүлэх</button>
  </div>

  <h2>Хичээл</h2>
  <div id="lessons" class="lessons"></div>
  <div class="row">
    <button id="sel-all" class="ghost sm">Бүгд</button>
    <button id="sel-none" class="ghost sm">Цэвэрлэх</button>
    <label class="chk"><input type="checkbox" id="inc-ref"> <span>Лавлах үг (<span class="jp">参考語彙</span>) оруулах</span></label>
  </div>

  <h2>Дасгал</h2>
  <div class="modes">
    <button class="mode" data-mode="flash"><b>Флашкарт</b><span>Карт эргүүлж өөрөө дүгнэнэ</span></button>
    <button class="mode" data-mode="choice"><b>Олон сонголт</b><span>4 хариултаас сонгоно</span></button>
    <button class="mode" data-mode="type"><b>Гараар бичих</b><span>Латинаар бичихэд кана болно</span></button>
    <button class="mode" data-mode="listen"><b>Сонсох</b><span>Дуудлагыг сонсоод таана</span></button>
  </div>

  <div id="voice-warn" class="warn" hidden></div>
  <p class="src">Эх сурвалж: <b>Irodori 入門 ことばリスト</b> (монгол орчуулга) — The Japan&nbsp;Foundation.
     Энэ апп нь зөвхөн хувийн давталтад зориулагдсан.</p>
</section>

<!-- ═══════════════════ ДАСГАЛ ═══════════════════ -->
<section id="study" class="screen" hidden>
  <div class="progress"><div id="pbar"></div></div>
  <div class="counter"><span id="c-done">0</span>/<span id="c-total">0</span>
       <span class="ok" id="c-ok">0</span> <span class="ng" id="c-ng">0</span></div>

  <div class="card" id="card">
    <div class="prompt-sub" id="p-sub"></div>
    <div class="prompt" id="p-main"></div>
    <button class="speak" id="btn-speak" title="Сонсох">🔊</button>

    <div class="answer" id="answer" hidden>
      <div class="a-kana" id="a-kana"></div>
      <div class="a-mn" id="a-mn"></div>
      <div class="a-acc" id="a-acc"></div>
    </div>
  </div>

  <div id="pane-flash" class="pane" hidden>
    <button class="primary big" id="f-show">Хариуг харах</button>
    <div class="row2" hidden id="f-judge">
      <button class="ng big" data-ok="0">Мэдэхгүй</button>
      <button class="ok big" data-ok="1">Мэдсэн</button>
    </div>
  </div>

  <div id="pane-choice" class="pane" hidden>
    <div id="choices" class="choices"></div>
  </div>

  <div id="pane-type" class="pane" hidden>
    <input id="t-input" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="латинаар бич — кана болно">
    <div class="t-kana" id="t-kana"></div>
    <button class="primary big" id="t-check">Шалгах</button>
  </div>

  <div id="pane-next" class="pane" hidden>
    <div class="verdict" id="verdict"></div>
    <button class="primary big" id="btn-next">Дараах</button>
  </div>
</section>

<!-- ═══════════════════ ЯВЦ ═══════════════════ -->
<section id="stats" class="screen" hidden>
  <h2>Явц</h2>
  <div id="stat-sum" class="statsum"></div>
  <h2>Хичээл тус бүрээр</h2>
  <div id="stat-lessons" class="statles"></div>
  <div class="row">
    <button id="btn-export" class="ghost sm">Явцыг хадгалах (.json)</button>
    <button id="btn-import" class="ghost sm">Сэргээх</button>
    <button id="btn-reset" class="ghost sm danger">Явцыг устгах</button>
  </div>
  <input type="file" id="file-import" accept="application/json" hidden>
</section>

<script src="app.js"></script>
</body>
</html>
